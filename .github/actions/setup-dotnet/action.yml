name: Setup .NET
description: Install the pinned .NET SDK and restore local tools.

inputs:
    dotnet-version:
        description: .NET SDK version to install.
        required: false
        default: 10.0.301
    restore-tools:
        description: Restore local dotnet tools.
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        -   name: Setup dotnet
            uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
            with:
                dotnet-version: ${{ inputs.dotnet-version }}

        -   name: Restore dotnet tools
            if: ${{ inputs.restore-tools == 'true' }}
            shell: bash
            run: dotnet tool restore
